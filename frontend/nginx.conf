server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /mock/ { proxy_pass http://api:8000; }
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location /static/ { proxy_pass http://api:8000; }

    location / { try_files $uri /index.html; }
}

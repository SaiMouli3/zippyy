services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zippy
      POSTGRES_PASSWORD: zippy
      POSTGRES_DB: zippy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zippy -d zippy"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://zippy:zippy@postgres:5432/zippy
      REDIS_URL: redis://redis:6379/0
      # Mock carriers are served by this same process; adapters call them over HTTP.
      CARRIER_BASE_URL: http://127.0.0.1:8000
      FASTSHIP_BASE_URL: http://127.0.0.1:8000/mock/fastship
      QUICKEXPRESS_BASE_URL: http://127.0.0.1:8000/mock/quickexpress
      RELIABLE_BASE_URL: http://127.0.0.1:8000/mock/reliable
      WEBHOOK_BASE_URL: http://127.0.0.1:8000
      CARRIER_TIMEOUT_MS: "3000"
      RATE_CACHE_TTL: "300"
      PARTIAL_RATE_CACHE_TTL: "60"
      DEFAULT_MERCHANT_ID: MER-DEMO
      SEED_DEMO: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
